name: CloudOps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: cloudops-enterprise-app

jobs:
  build-test-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Test main application
        run: |
          python -c "import sys; sys.path.insert(0, 'app'); from app import app; client = app.test_client(); response = client.get('/health'); assert response.status_code == 200; print(response.json)"

      - name: Test user service
        run: |
          python -m pip install -r microservices/user-service/requirements.txt
          python -c "import sys; sys.path.insert(0, 'microservices/user-service'); from app import app; client = app.test_client(); response = client.get('/health'); assert response.status_code == 200; print(response.json)"

      - name: Test order service
        run: |
          python -m pip install -r microservices/order-service/requirements.txt
          python -c "import sys; sys.path.insert(0, 'microservices/order-service'); from app import app; client = app.test_client(); response = client.get('/health'); assert response.status_code == 200; print(response.json)"

      - name: Build main application image
        run: docker build -t cloudops-app:${{ github.sha }} ./app

      - name: Build user service image
        run: docker build -t cloudops-user-service:${{ github.sha }} ./microservices/user-service

      - name: Build order service image
        run: docker build -t cloudops-order-service:${{ github.sha }} ./microservices/order-service

      - name: Scan main application
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: cloudops-app:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Scan user service
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: cloudops-user-service:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Scan order service
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: cloudops-order-service:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  deploy:
    needs: build-test-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push images
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }} ./app
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:user-${{ github.sha }} ./microservices/user-service
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:order-${{ github.sha }} ./microservices/order-service

          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:user-${{ github.sha }}
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:order-${{ github.sha }}

      - name: Update Kubernetes image references
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          sed -i "s|image: .*cloudops-enterprise-app:.*|image: $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}|" kubernetes/deployment.yaml
          sed -i "s|image: .*cloudops-enterprise-app:user-service|image: $ECR_REGISTRY/$ECR_REPOSITORY:user-${{ github.sha }}|" kubernetes/user-service.yaml
          sed -i "s|image: .*cloudops-enterprise-app:order-service|image: $ECR_REGISTRY/$ECR_REPOSITORY:order-${{ github.sha }}|" kubernetes/order-service.yaml

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name cloudops-eks

      - name: Deploy Kubernetes workloads
        run: |
          kubectl apply -f kubernetes/deployment.yaml
          kubectl apply -f kubernetes/service.yaml
          kubectl apply -f kubernetes/user-service.yaml
          kubectl apply -f kubernetes/order-service.yaml
          kubectl apply -f kubernetes/ingress.yaml

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/cloudops-app --timeout=180s
          kubectl rollout status deployment/user-service --timeout=180s
          kubectl rollout status deployment/order-service --timeout=180s